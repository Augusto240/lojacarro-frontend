server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /usuarios-api/ {
        proxy_pass http://usuarios-api:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /loja-api/ {
        proxy_pass http://lojacarro-api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
